name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: # lets you manually trigger the E2E job once you have a real deployed URL

jobs:
  backend:
    name: Backend — type-check, test, build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: protein_panda_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/protein_panda_ci
      JWT_SECRET: ci-only-secret-never-used-in-production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      - name: Generate Prisma client
        working-directory: backend
        run: npx prisma generate

      - name: Type-check
        working-directory: backend
        run: npx tsc --noEmit

      - name: Run migrations against the CI database
        working-directory: backend
        run: npx prisma migrate deploy

      - name: Unit tests
        working-directory: backend
        run: npm test -- --ci

      - name: Production build
        working-directory: backend
        run: npm run build

  frontend:
    name: Frontend — type-check, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Type-check
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Production build
        working-directory: frontend
        # Dummy value — this build step only proves the app compiles
        # cleanly; it doesn't call a real API. The actual deployment
        # step (not in this workflow) is what needs the real value.
        env:
          NEXT_PUBLIC_API_URL: https://placeholder.invalid/api
        run: npm run build

  security:
    name: Dependency vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Audit backend dependencies
        working-directory: backend
        run: npm audit --audit-level=high || true
        # `|| true` — a failed audit warns in the log without blocking
        # the pipeline. Flip this to a hard failure once you've done an
        # initial cleanup pass (see the security hardening notes in
        # PRODUCTION.md) — starting as a hard gate on day one would
        # likely block CI on pre-existing transitive-dependency issues
        # that need triage first, not urgent same-day fixes.

      - name: Audit frontend dependencies
        working-directory: frontend
        run: npm audit --audit-level=high || true

  # Not wired to run automatically against a live URL yet — there's no
  # deployed instance to point it at as part of this CI config. Trigger
  # manually (workflow_dispatch) once you have a real staging/production
  # URL, passing it as BASE_URL. See e2e/playwright.config.ts.
  e2e:
    name: E2E tests (manual trigger — needs a live deployment URL)
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Playwright
        working-directory: e2e
        run: npm ci && npx playwright install --with-deps
      - name: Run E2E suite against the deployed app
        working-directory: e2e
        env:
          BASE_URL: ${{ vars.STAGING_URL }}
        run: npm test
